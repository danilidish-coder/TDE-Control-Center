name: Temporary source QA

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/temp-source-qa.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install PySide6==6.9.2 lxml openpyxl python-docx pytest
      - name: Run targeted regressions
        working-directory: source
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q \
            tests/test_fines_correction.py \
            tests/test_periodicals.py \
            tests/test_periodicals_unified.py \
            tests/test_periodicals_unified_integration.py \
            tests/test_periodicals_unified_stress.py \
            tests/test_v105_report_behavior.py
