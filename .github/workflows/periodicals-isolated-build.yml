name: Periodicals isolated Windows validation and EXE
on:
  push:
    branches:
      - fix/periodicals-legacy-bat-roots-20261025
    paths:
      - .github/workflows/periodicals-isolated-build.yml
permissions:
  contents: read
jobs:
  validate-build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r source/requirements.txt -r source/requirements-build.txt pytest
      - name: Run periodicals regression tests
        working-directory: source
        run: python -m pytest -q tests/test_periodicals_unified_integration.py tests/test_periodicals_unified_stress.py
      - name: Build EXE
        working-directory: source
        run: python -m PyInstaller --clean --noconfirm TDE_CONTROL_CENTER_v1.0.spec
      - name: Rename test binary
        shell: pwsh
        run: Copy-Item source/dist/TDE_CONTROL_CENTER_v1.0.exe TDE_CONTROL_CENTER_PERIODICALS_TEST_20261025.exe
      - name: Upload isolated test binary
        uses: actions/upload-artifact@v4
        with:
          name: TDE_CONTROL_CENTER_PERIODICALS_TEST_20261025
          path: TDE_CONTROL_CENTER_PERIODICALS_TEST_20261025.exe
