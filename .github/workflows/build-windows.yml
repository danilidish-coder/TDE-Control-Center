name: Build Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'source/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Locate project source
        id: locate
        shell: pwsh
        run: |
          $spec = Get-ChildItem -Path 'source' -Filter 'TDE_Control_Center.spec' -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          # Transitional fallback only: once the repository migration is complete,
          # the ZIP is removed and builds use the unpacked source exclusively.
          if (-not $spec -and (Test-Path 'TDE_Control_Center_FINAL_BUILD_SOURCE.zip')) {
            Expand-Archive -Path 'TDE_Control_Center_FINAL_BUILD_SOURCE.zip' -DestinationPath '_legacy_source' -Force
            $spec = Get-ChildItem -Path '_legacy_source' -Filter 'TDE_Control_Center.spec' -Recurse | Select-Object -First 1
          }

          if (-not $spec) {
            throw 'TDE_Control_Center.spec not found in unpacked source.'
          }

          $projectDir = Split-Path $spec.FullName -Parent
          "PROJECT_DIR=$projectDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SPEC_FILE=$($spec.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Project directory: $projectDir"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path (Join-Path $env:PROJECT_DIR 'requirements-build.txt')) {
            python -m pip install -r (Join-Path $env:PROJECT_DIR 'requirements-build.txt')
          } elseif (Test-Path (Join-Path $env:PROJECT_DIR 'requirements.txt')) {
            python -m pip install -r (Join-Path $env:PROJECT_DIR 'requirements.txt')
            python -m pip install pyinstaller
          } else {
            throw 'No requirements-build.txt or requirements.txt found.'
          }

      - name: Build EXE
        shell: pwsh
        run: |
          Push-Location $env:PROJECT_DIR
          python -m PyInstaller --clean --noconfirm $env:SPEC_FILE
          if (!(Test-Path 'dist\TDE_Control_Center.exe')) {
            throw 'EXE was not created'
          }
          Pop-Location

      - name: Smoke test startup
        shell: pwsh
        run: |
          $exe = Join-Path $env:PROJECT_DIR 'dist\TDE_Control_Center.exe'
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            if ($p.ExitCode -ne 0) {
              throw "EXE exited during smoke test with code $($p.ExitCode)"
            }
          } else {
            Stop-Process -Id $p.Id -Force
          }

      - name: SHA256
        shell: pwsh
        run: |
          $exe = Join-Path $env:PROJECT_DIR 'dist\TDE_Control_Center.exe'
          $hashFile = "$exe.sha256.txt"
          Get-FileHash $exe -Algorithm SHA256 | Format-List
          Get-FileHash $exe -Algorithm SHA256 | Select-Object -ExpandProperty Hash | Out-File $hashFile -Encoding ascii

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'artifact' | Out-Null
          Copy-Item (Join-Path $env:PROJECT_DIR 'dist\TDE_Control_Center.exe') 'artifact\TDE_Control_Center.exe'
          Copy-Item (Join-Path $env:PROJECT_DIR 'dist\TDE_Control_Center.exe.sha256.txt') 'artifact\TDE_Control_Center.exe.sha256.txt'

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TDE-Control-Center-Windows
          path: artifact/**
          if-no-files-found: error
          retention-days: 30
