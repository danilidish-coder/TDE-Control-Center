name: Archive verified Phase 2 candidate EXE (one time)

on:
  push:
    branches: [delivery/control-center-phase2-20261017]
    paths: ['.github/workflows/archive-phase2-candidate.yml']

permissions:
  contents: write
  actions: read

jobs:
  publish-verified-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact GitHub Actions candidate and verify bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_ID=12094855467
          EXPECTED_SHA=f782edc38cb7881a0e6862bc00aec49e111135c572789c02970d3877c77b6f02
          echo "Retrieving exact artifact ${ARTIFACT_ID} from successful validation run 39015354501"
          curl --fail --show-error --silent --location --retry 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o artifact.zip
          unzip -p artifact.zip source/dist/TDE_CONTROL_CENTER_v1.0.exe > TDE_CONTROL_CENTER_PHASE2_CANDIDATE_2026-10-17.exe
          printf '%s  %s\n' "$EXPECTED_SHA" TDE_CONTROL_CENTER_PHASE2_CANDIDATE_2026-10-17.exe | sha256sum --check --
          test "$(stat -c %s TDE_CONTROL_CENTER_PHASE2_CANDIDATE_2026-10-17.exe)" -eq 65176381
          unzip -p artifact.zip validation/build-manifest.json > verified-build-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("verified-build-manifest.json").read_text())
          assert d["sha256"]=="f782edc38cb7881a0e6862bc00aec49e111135c572789c02970d3877c77b6f02"
          assert d["source_commit"]=="557558b5d25695ecf93c9e50be99f0c67afe7859"
          assert d["validation_source_commit"]=="70c1eb0ddf8b3bfcbabbb4e58afc1ca2c3097909"
          assert d["production_release"] is False
          print("Verified build source, validation source and binary identity")
          PY
          printf '%s  %s\n' "$EXPECTED_SHA" TDE_CONTROL_CENTER_PHASE2_CANDIDATE_2026-10-17.exe > TDE_CONTROL_CENTER_PHASE2_CANDIDATE_2026-10-17.sha256.txt
          cat > CANDIDATE_NOTES.md <<'EOF'
          ## CONTROL CENTER — Phase 2 tested candidate (17 October 2026)
          
          **CANDIDATE — NOT APPROVED FOR PRODUCTION.** The existing v1.0.14 remains available unchanged. No prior tag, release or asset was removed.
          
          - Original Windows EXE built from commit: 557558b5d25695ecf93c9e50be99f0c67afe7859.
          - Windows end-to-end validation commit: 70c1eb0ddf8b3bfcbabbb4e58afc1ca2c3097909.
          - Validation: https://github.com/danilidish-coder/TDE-Control-Center/actions/runs/39015354501 — SUCCESS, 228 tests PASS.
          - EXE SHA-256: f782edc38cb7881a0e6862bc00aec49e111135c572789c02970d3877c77b6f02
          - EXE size: 65,176,381 bytes.
          - Embedded application version remains 1.0.14; no new version number is claimed.
          - Pending on-site tests: Microsoft Word opening/printing, Office, network file permissions, multi-station SMB.
          - This release is an archived candidate, not a deployment action.
          
          GitHub source audit: [Phase 2 report](https://github.com/danilidish-coder/TDE-Control-Center/blob/audit/phase2-hardening-20261017/docs/PHASE2_HARDENING_EL.md).
          EOF
      - name: Publish as new, non-overwriting prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="phase2-candidate-20261017"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "STOP: candidate release already exists; no replacement performed."
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            echo "STOP: candidate tag already exists; no replacement performed."
            exit 1
          fi
          gh release create "$TAG" \
            --target "557558b5d25695ecf93c9e50be99f0c67afe7859" \
            --title "CONTROL CENTER - Phase 2 verified candidate (2026-10-17)" \
            --prerelease \
            --notes-file CANDIDATE_NOTES.md \
            TDE_CONTROL_CENTER_PHASE2_CANDIDATE_2026-10-17.exe \
            TDE_CONTROL_CENTER_PHASE2_CANDIDATE_2026-10-17.sha256.txt
          gh release view "$TAG" --json url,tagName,isPrerelease,assets
