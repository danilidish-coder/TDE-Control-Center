name: CONTROL CENTER field corrections candidate validation
on:
  push:
    branches: [fix/phase2-field-corrections-20261022]
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  VALIDATION_EVIDENCE_REF: refs/heads/validation/control-center-field-corrections-20261022
concurrency:
  group: control-center-field-corrections-20261022
  cancel-in-progress: true
jobs:
  windows-functional:
    if: ${{ !contains(github.event.head_commit.message, '[native-recheck]') }}
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: 557558b5d25695ecf93c9e50be99f0c67afe7859
          fetch-depth: 0
          path: _baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record Windows run before installation
        env:
          VALIDATION_JOB_STATUS: running
        run: python tools/persist_validation_evidence.py
      - name: Install application and test dependencies
        run: python -m pip install -r source/requirements.txt python-docx pytest pywinauto psutil pillow
      - name: Repeat focused Windows lock safety and real concurrent writes three times
        working-directory: source
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../validation | Out-Null
          foreach ($attempt in 1..3) {
            python -m pytest -q tests/test_field_windows_lock.py tests/test_phase2_lock_safety.py tests/test_concurrency.py --junitxml=../validation/lock-focused-$attempt-windows.xml
            if ($LASTEXITCODE -ne 0) { throw "Focused Windows lock regression failed on attempt $attempt" }
          }
      - name: Capture exact approved Phase2 baseline regressions
        working-directory: _baseline/source
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ../../validation | Out-Null
          python -m pytest -q tests --junitxml=../../validation/baseline-windows.xml
          if ($LASTEXITCODE -notin @(0, 1)) { throw 'Approved baseline did not complete' }
          # Preserve the real XML: the following strict comparison permits only
          # the recorded baseline WinError 5 signature, and zero candidate failures.
          exit 0
      - name: Run all candidate regressions with no skipped failures
        working-directory: source
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          python -m pytest -q tests --junitxml=../validation/candidate-windows.xml
          if ($LASTEXITCODE -ne 0) { throw 'Candidate regressions failed' }
      - name: Require zero candidate failures and audit only the proven baseline lock race
        run: python tools/compare_field_regressions.py --baseline validation/baseline-windows.xml --current validation/candidate-windows.xml --output validation/windows-comparison.json
      - name: Build fresh versioned Windows candidate EXE
        working-directory: source
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm TDE_CONTROL_CENTER_v1.0.spec *> ../validation/build-windows.log
          if ($LASTEXITCODE -ne 0) { throw 'Fresh Windows candidate build failed' }
      - name: Record source, run and exact binary identity
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, os, runpy
          identity = runpy.run_path('source/app/version.py')
          exe = Path('source/dist') / (identity['EXE_NAME'] + '.exe')
          manifest = {
              'source_commit': os.environ['GITHUB_SHA'],
              'approved_base': '557558b5d25695ecf93c9e50be99f0c67afe7859',
              'version': identity['APP_VERSION'], 'exe': exe.name,
              'bytes': exe.stat().st_size,
              'sha256': hashlib.sha256(exe.read_bytes()).hexdigest(),
              'run_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'production_release': False,
          }
          Path('validation/build-manifest.json').write_text(json.dumps(manifest, indent=2) + chr(10), encoding='utf-8')
      - name: Integrated external native UI check of the real frozen EXE
        shell: pwsh
        run: |
          python tools/exercise_windows_exe.py source/dist/TDE_CONTROL_CENTER_v1.0.15_CANDIDATE.exe --output validation/frozen-exe *> validation/native-driver.log
          if ($LASTEXITCODE -ne 0) { throw 'Frozen candidate functional validation failed' }
      - name: Preserve candidate EXE and full evidence without a production release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-center-field-candidate-${{ github.sha }}
          path: |
            validation/
            source/dist/TDE_CONTROL_CENTER_v1.0.15_CANDIDATE.exe
          retention-days: 14
      - name: Save evidence in the isolated validation branch
        if: always()
        env:
          VALIDATION_JOB_STATUS: ${{ job.status }}
        run: python tools/persist_validation_evidence.py
