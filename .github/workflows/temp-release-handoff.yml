name: Temporary release handoff
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Print signed release URL
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          NAME="TDE_CONTROL_CENTER_v1.0.13_FULL.zip"
          ID="$(gh api "repos/$REPO/releases/tags/v1.0.13" --jq ".assets[] | select(.name==\"$NAME\") | .id")"
          test -n "$ID"
          API_URL="https://api.github.com/repos/$REPO/releases/assets/$ID"
          curl -sS -D headers.txt -o /dev/null -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$API_URL"
          LOC="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print}' headers.txt | tail -1)"
          test -n "$LOC"
          ENC="$(printf %s "$LOC" | base64 -w0)"
          echo "SIGNED_URL_B64=$ENC"
