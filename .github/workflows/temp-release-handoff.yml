name: Temporary release handoff
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Download existing release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download v1.0.13 --repo "$REPO" --pattern "TDE_CONTROL_CENTER_v1.0.13_FULL.zip"
          test -s TDE_CONTROL_CENTER_v1.0.13_FULL.zip
      - name: Expose ZIP as temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: TDE_CONTROL_CENTER_v1.0.13_FULL
          path: TDE_CONTROL_CENTER_v1.0.13_FULL.zip
          retention-days: 1
          if-no-files-found: error
