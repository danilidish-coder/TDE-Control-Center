name: Temporary release handoff
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Print signed release URL
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          NAME="TDE_CONTROL_CENTER_v1.0.13_FULL.zip"
          BURL="$(gh api "repos/$REPO/releases/tags/v1.0.13" --jq ".assets[] | select(.name==\"$NAME\") | .browser_download_url")"
          test -n "$BURL"
          curl -sS -D headers.txt -o /dev/null -H "Authorization: Bearer $GH_TOKEN" "$BURL"
          LOC="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]+:[[:space:]]*/, ""); sub(/\r$/, ""); print}' headers.txt | tail -1)"
          test -n "$LOC"
          echo "SIGNED_URL=$LOC"
