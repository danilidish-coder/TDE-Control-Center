name: Clean Superseded Repository Data

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cleanup-releases.yml'

permissions:
  contents: write
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only current v1.0.13 and remove superseded GitHub clutter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          KEEP_TAG="v1.0.13"

          echo "Removing superseded Releases."
          gh release list -R "$REPO" --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$tag" != "$KEEP_TAG" ]; then
              gh release delete "$tag" -R "$REPO" --cleanup-tag -y
            fi
          done

          echo "Removing non-current standalone tags."
          gh api --paginate "repos/$REPO/git/matching-refs/tags/" --jq '.[].ref' | while read -r ref; do
            [ -z "$ref" ] && continue
            tag="${ref#refs/tags/}"
            if [ "$tag" != "$KEEP_TAG" ]; then
              gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" >/dev/null 2>&1 || true
            fi
          done

          echo "Removing temporary branches."
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | while read -r branch; do
            [ -z "$branch" ] && continue
            if [ "$branch" != "main" ]; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null 2>&1 || true
            fi
          done

          echo "Removing Actions artifacts."
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id' | while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            gh api -X DELETE "repos/$REPO/actions/artifacts/$artifact_id" >/dev/null 2>&1 || true
          done

          echo "Cleanup complete. Current baseline retained: $KEEP_TAG on main with source/ and current Release."
