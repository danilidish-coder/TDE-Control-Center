name: Clean Superseded Repository Data

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/cleanup-releases.yml'

permissions:
  contents: write
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded releases, tags, branches and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Deleting all obsolete GitHub Releases and their release tags."
          gh release list -R "$REPO" --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" -R "$REPO" --cleanup-tag -y
          done

          echo "Deleting non-main branches."
          gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | while read -r branch; do
            [ -z "$branch" ] && continue
            if [ "$branch" != "main" ]; then
              gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" >/dev/null 2>&1 || true
            fi
          done

          echo "Deleting redundant Actions artifacts."
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id' | while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            gh api -X DELETE "repos/$REPO/actions/artifacts/$artifact_id" >/dev/null 2>&1 || true
          done

          echo "Cleanup complete. Validated v1.0.13 remains in Drive; no older GitHub release is retained."
