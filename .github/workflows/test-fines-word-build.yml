name: Build v1.0.14 test release

on:
  push:
    branches:
      - test-fines-word-preview

permissions:
  contents: write

jobs:
  test-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install PyInstaller PySide6==6.9.2 lxml pywin32 openpyxl python-docx pytest

      - name: Verify fines open as Word
        shell: python
        run: |
          from pathlib import Path
          fines = Path("source/app/ui/fines_page.py").read_text(encoding="utf-8")
          reports = Path("source/app/ui/shift_reports.py").read_text(encoding="utf-8")
          assert "os.startfile(str(path))" in fines
          assert "open_document_preview(path)" not in fines
          assert 'if kind == "FINES" and os.name == "nt":' in reports
          print("Word-opening regression checks passed")

      - name: Run relevant regression suite
        working-directory: source
        run: python -m pytest -q tests/test_core.py tests/test_end_to_end.py tests/test_fines_correction.py tests/test_pending.py tests/test_shift_reports_archive.py tests/test_concurrency.py

      - name: Build Windows EXE
        working-directory: source
        run: python -m PyInstaller --clean --noconfirm TDE_CONTROL_CENTER_v1.0.spec

      - name: Smoke test EXE
        shell: pwsh
        run: |
          $exe = '.\source\dist\TDE_CONTROL_CENTER_v1.0.exe'
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "EXE exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Copy-Item $exe '.\TDE_CONTROL_CENTER_v1.0.14_TEST.exe'
          Get-FileHash '.\TDE_CONTROL_CENTER_v1.0.14_TEST.exe' -Algorithm SHA256

      - name: Publish isolated test prerelease asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.14-test'
          $asset = 'TDE_CONTROL_CENTER_v1.0.14_TEST.exe'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title 'v1.0.14 TEST' --notes 'Test build of v1.0.14. Production v1.0.13 remains available for rollback.' --target $env:GITHUB_SHA --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create test prerelease' }
          }
          gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload test EXE to prerelease' }
          $assetId = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[] | select(.name=="TDE_CONTROL_CENTER_v1.0.14_TEST.exe") | .id'
          if (-not $assetId) { throw 'Asset id not found' }
          $apiUrl="https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$assetId"
          curl.exe -sS -D redirect_headers.txt -o NUL -H "Authorization: Bearer $env:GH_TOKEN" -H "Accept: application/octet-stream" $apiUrl
          $location=(Get-Content redirect_headers.txt | Where-Object { $_ -match '^location:' } | Select-Object -Last 1)
          if (-not $location) { throw 'Signed redirect URL not returned' }
          $signed=$location.Substring(9).Trim()
          Write-Host "SIGNED_URL=$signed"
